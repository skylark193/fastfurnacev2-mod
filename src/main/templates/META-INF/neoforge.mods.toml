license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="skylark193"
description='''
Adds Lava-Infused blocks and materials, a lava-powered Accelerator, four tiers of furnaces, crushers, generators, batteries, and power conduits, dynamically tinted crushed ores, an extensible modding API, and optional JEI and Jade integration.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[${jei_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26.1.12,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbmaterials"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
